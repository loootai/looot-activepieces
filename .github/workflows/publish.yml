# Publishes @loootai/piece-looot to npm with a provenance statement.
# NOT RUN YET. Needs an NPM_TOKEN secret (or npm trusted publishing) for the @loootai scope.
# Release: bump "version" in package.json, commit, push a tag such as v0.0.2.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
